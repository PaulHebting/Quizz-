<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terre Adélie - Quiz Jardinier 🌿</title>
    <meta name="description" content="Testez et développez vos connaissances de jardinier professionnel avec plus de 300 questions - Terre Adélie.">
    <meta name="theme-color" content="#0a2f1d">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Terre Adélie">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Manrope', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a2f1d;
            background-image:
                radial-gradient(circle at 15% 8%, rgba(90, 154, 69, 0.14), transparent 40%),
                radial-gradient(circle at 85% 92%, rgba(201, 123, 74, 0.10), transparent 45%);
            color: #f4ecd8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #123726;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(90, 154, 69, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #3a4f3e;
            position: relative;
        }

        @keyframes flashSuccess {
            0% { background: #123726; }
            50% { background: rgba(34, 197, 94, 0.4); transform: scale(1.01); }
            100% { background: #123726; transform: scale(1); }
        }

        @keyframes flashError {
            0% { background: #123726; transform: translateX(0); }
            20% { transform: translateX(-6px); background: rgba(239, 68, 68, 0.4); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); background: #123726; }
        }

        .mobile-container.success-anim {
            animation: flashSuccess 0.5s ease;
        }

        .mobile-container.error-anim {
            animation: flashError 0.5s ease;
        }

        .brand-header {
            background: #0a2f1d;
            padding: 14px 16px 4px;
            display: flex;
            justify-content: center;
        }

        .brand-logo {
            height: 34px;
            width: auto;
            object-fit: contain;
        }

        /* Top Profile Section */
        .top-profile-section {
            background: #0a2f1d;
            padding: 12px 16px;
            border-bottom: 1px solid #3a4f3e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .user-profile-card {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
            min-width: 0;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5a9a45, #3f7a30);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid #8bc46e;
            flex-shrink: 0;
        }

        .brand-header {
            display: flex;
            justify-content: center;
            padding: 6px 0 2px;
        }

        .brand-logo {
            height: 34px;
            width: auto;
            object-fit: contain;
        }
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .profile-name-display {
            font-family: 'Fraunces', Georgia, serif;
            color: #f4ecd8;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-subtitle {
            font-size: 10px;
            color: #c97b4a;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #f8dd6c;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Progress Bar & Points Section */
        .progress-bar-container {
            background: #071f13;
            padding: 10px 16px;
            border-bottom: 1px solid #3a4f3e;
        }

        .progress-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .rank-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 12.5px;
            color: #f8dd6c;
            font-weight: 600;
        }

        .score-badges-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .combo-badge {
            background: rgba(249, 115, 22, 0.15);
            color: #f8dd6c;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: none;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #8bc46e;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: #9db096;
            margin-bottom: 3px;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(90deg, #24352a, #24352a 4px, #2c4033 4px, #2c4033 8px);
            border-radius: 999px;
            overflow: visible;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3f7a30, #5a9a45 55%, #8bc46e);
            width: 0%;
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .progress-marker {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            font-size: 15px;
            transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
        }

        /* Jokers Bar */
        .jokers-bar {
            display: flex;
            gap: 6px;
            padding: 8px 16px 0 16px;
            background: #123726;
        }

        .joker-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #c97b4a;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #3a4f3e;
            color: #9db096;
        }

        /* App Content */
        .app-content {
            flex: 1;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .quiz-box {
            background: #3a4f3e;
            border-radius: 12px;
            padding: 12px;
        }

        .question-title {
            font-family: 'Manrope', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #c97b4a;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .question-text {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 15px;
            font-weight: 600;
            font-optical-sizing: auto;
            color: #f4ecd8;
            line-height: 1.38;
            letter-spacing: 0.1px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .option-btn {
            background: linear-gradient(180deg, #16281d, #12211a);
            border: 1.5px solid #3a4f3e;
            color: #f4ecd8;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
            line-height: 1.3;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #8bc46e;
            transform: translateY(-1px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(0px) scale(0.99);
        }

        .option-btn.hidden-by-joker {
            display: none;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #5a9a45;
            border-radius: 9px;
            padding: 8px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 11px;
            color: #e8dfc8;
            line-height: 1.25;
            margin-top: 2px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 11.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #c2703f;
            color: white;
            text-decoration: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
        }

        .next-btn {
            display: none;
            background: #5a9a45;
            color: #0a2f1d;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #3a4f3e;
            color: #c97b4a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
            width: 100%;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #123726;
            border: 1px solid #3a4f3e;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #3a4f3e;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #f8dd6c;
        }

        .close-modal {
            background: #3a4f3e;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0a2f1d;
            border: 1px solid #3a4f3e;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.55;
            filter: grayscale(85%);
            position: relative;
            overflow: hidden;
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
        }

        .trophy-item.rarity-bronze.unlocked { border-color: rgba(205, 127, 50, 0.6); background: rgba(205, 127, 50, 0.08); box-shadow: 0 0 12px rgba(205, 127, 50, 0.15); }
        .trophy-item.rarity-silver.unlocked { border-color: rgba(203, 213, 225, 0.7); background: rgba(203, 213, 225, 0.08); box-shadow: 0 0 12px rgba(203, 213, 225, 0.2); }
        .trophy-item.rarity-gold.unlocked { border-color: rgba(250, 204, 21, 0.7); background: rgba(250, 204, 21, 0.08); box-shadow: 0 0 14px rgba(250, 204, 21, 0.25); }
        .trophy-item.rarity-platinum.unlocked { border-color: rgba(167, 139, 250, 0.8); background: rgba(167, 139, 250, 0.1); box-shadow: 0 0 16px rgba(167, 139, 250, 0.35); }

        .trophy-icon-wrap {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
        }
        .trophy-item.rarity-bronze.unlocked .trophy-icon-wrap { background: radial-gradient(circle, rgba(205,127,50,0.35), transparent 70%); }
        .trophy-item.rarity-silver.unlocked .trophy-icon-wrap { background: radial-gradient(circle, rgba(203,213,225,0.35), transparent 70%); }
        .trophy-item.rarity-gold.unlocked .trophy-icon-wrap { background: radial-gradient(circle, rgba(250,204,21,0.4), transparent 70%); }
        .trophy-item.rarity-platinum.unlocked .trophy-icon-wrap { background: radial-gradient(circle, rgba(167,139,250,0.45), transparent 70%); }

        .trophy-icon { font-size: 22px; }
        .trophy-details { flex: 1; min-width: 0; }
        .trophy-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .trophy-details h4 { font-size: 13px; color: #f4ecd8; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #9db096; margin-bottom: 4px; }

        .rarity-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 7px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .rarity-badge-bronze { background: rgba(205, 127, 50, 0.2); color: #cd7f32; }
        .rarity-badge-silver { background: rgba(203, 213, 225, 0.2); color: #cbd5e1; }
        .rarity-badge-gold { background: rgba(250, 204, 21, 0.2); color: #f8dd6c; }
        .rarity-badge-platinum { background: rgba(167, 139, 250, 0.25); color: #b28bdb; }

        .trophy-progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 2px;
        }
        .trophy-progress-fill { height: 100%; border-radius: 999px; }
        .rarity-fill-bronze { background: #cd7f32; }
        .rarity-fill-silver { background: #cbd5e1; }
        .rarity-fill-gold { background: #f8dd6c; }
        .rarity-fill-platinum { background: #b28bdb; }

        .trophy-progress-label { font-size: 10px; color: #8a9c85; }
        .trophy-unlocked-label { font-size: 10px; color: #8bc46e; font-weight: 600; }

        .profile-edit-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .avatar-option-btn {
            background: #0a2f1d;
            border: 2px solid #3a4f3e;
            border-radius: 12px;
            font-size: 28px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .avatar-option-btn.selected {
            border-color: #8bc46e;
            background: rgba(74, 222, 128, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #9db096;
        }

        .form-input {
            background: #0a2f1d;
            border: 2px solid #3a4f3e;
            color: #f4ecd8;
            font-size: 14px;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        .form-input:focus {
            border-color: #c97b4a;
        }

        .save-profile-btn {
            background: #5a9a45;
            color: #0a2f1d;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #f8dd6c;
            color: #0a2f1d;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container" id="main-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <!-- Modale Trophées -->
    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Grades</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <!-- Modale Espace Profil -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ Mon Espace Profil</div>
                <button class="close-modal" onclick="toggleProfileModal()">×</button>
            </div>
            <div class="profile-edit-body">
                <div class="form-group">
                    <label class="form-label">Changer de prénom / pseudo :</label>
                    <input type="text" class="form-input" id="modal-username-input" placeholder="Ton prénom...">
                </div>
                <div class="form-group">
                    <label class="form-label">Choisir ton avatar :</label>
                    <div class="avatar-selection-grid" id="avatar-grid"></div>
                </div>
                <button class="save-profile-btn" onclick="saveProfileChanges()">Enregistrer les modifications</button>
            </div>
        </div>
    </div>

    <!-- 1. INTERFACE PROFIL EN HAUT (Avatar + Prénom) -->
    <div class="brand-header">
        <img src="logo.png" alt="Terre Adélie" class="brand-logo">
    </div>
    <div class="top-profile-section">
        <div class="user-profile-card" onclick="toggleProfileModal()">
            <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            <div class="profile-info">
                <div class="profile-name-display" id="profile-name-view">JardinierExpert</div>
                <div class="profile-subtitle">⚙️ Cliquer pour modifier le profil</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
        </div>
    </div>

    <!-- 2. BARRE DE PROGRESSION + SYSTEME DE POINTS (En dessous) -->
    <div class="progress-bar-container">
        <div class="progress-top-row">
            <div class="rank-title" id="rank-display">🌱 Graine de radis</div>
            <div class="score-badges-group">
                <button id="sound-toggle-btn" onclick="toggleSound()" style="background:rgba(255,255,255,0.08); border:none; border-radius:999px; width:32px; height:32px; font-size:16px; cursor:pointer; color:#fff;">🔊</button>
                <div class="combo-badge" id="combo-badge">🔥 x0</div>
                <div class="score-badge" id="score-display">0 Pts</div>
            </div>
        </div>
        <div class="progress-info">
            <span id="progress-text-label">Grade suivant : Pousse tendre</span>
            <span id="progress-percent-label">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-marker" id="progress-marker">🌱</div>
        </div>
    </div>

    <!-- Barre des Jokers -->
    <div class="jokers-bar">
        <button class="joker-btn" id="joker-50" onclick="useJoker50()">✂️ 50/50 (<span id="count-50">2</span>)</button>
        <button class="joker-btn" id="joker-tip" onclick="useJokerTip()">💡 Indice (<span id="count-tip">2</span>)</button>
    </div>

    <!-- Contenu du Quiz -->
    <div class="app-content">
        <div class="quiz-box">
            <div class="question-title">❓ QUESTION CLIENT</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn" onclick="trackWikiClick()">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // Base de questions avec des distracteurs plus réalistes et nuancés
    const uniqueQuizPool = [

    // ===== Moteur de sons (synthétisé, aucun fichier audio requis, fonctionne hors-ligne) =====
    const SoundEngine = (function () {
        let ctx = null;
        let muted = (localStorage.getItem('jardin_client_muted_500') === '1');

        function getCtx() {
            if (!ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) ctx = new AC();
            }
            if (ctx && ctx.state === "suspended") ctx.resume();
            return ctx;
        }

        function tone(freq, startOffset, duration, type, gainPeak) {
            const c = getCtx();
            if (!c || muted) return;
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = type || "sine";
            osc.frequency.value = freq;
            const now = c.currentTime + startOffset;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(gainPeak || 0.15, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
        }

        return {
            isMuted: () => muted,
            toggleMute: function () {
                muted = !muted;
                localStorage.setItem('jardin_client_muted_500', muted ? '1' : '0');
                return muted;
            },
            playClick: function () {
                tone(600, 0, 0.08, "square", 0.06);
            },
            playCorrect: function () {
                tone(523.25, 0, 0.15, "sine", 0.15);
                tone(659.25, 0.08, 0.15, "sine", 0.15);
                tone(783.99, 0.16, 0.25, "sine", 0.15);
            },
            playWrong: function () {
                tone(220, 0, 0.18, "sawtooth", 0.12);
                tone(164.81, 0.12, 0.28, "sawtooth", 0.12);
            },
            playTrophy: function () {
                tone(523.25, 0, 0.15, "triangle", 0.15);
                tone(659.25, 0.12, 0.15, "triangle", 0.15);
                tone(783.99, 0.24, 0.15, "triangle", 0.15);
                tone(1046.5, 0.36, 0.35, "triangle", 0.18);
            },
            playCombo: function () {
                tone(880, 0, 0.1, "sine", 0.12);
                tone(1108.73, 0.06, 0.18, "sine", 0.12);
            }
        };
    })();

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateRankDisplay() {
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (score >= r.min) currentRank = r;
        }
        document.getElementById("rank-display").innerText = currentRank.title;

        let nextRankObj = ranks.find(r => r.min > score);
        let progressPercent = 100;
        let progressLabelText = "Niveau Max Atteint ! 👑";

        if (nextRankObj) {
            let span = nextRankObj.min - currentRank.min;
            let currentProgress = score - currentRank.min;
            progressPercent = Math.min(100, Math.max(0, Math.floor((currentProgress / span) * 100)));
            progressLabelText = `Suivant : ${nextRankObj.title}`;
        }

        document.getElementById("progress-text-label").innerText = progressLabelText;
        document.getElementById("progress-percent-label").innerText = progressPercent + "%";
        document.getElementById("progress-fill").style.width = progressPercent + "%";
        const markerEmoji = currentRank.title.split(" ")[0];
        const marker = document.getElementById("progress-marker");
        marker.innerText = markerEmoji;
        marker.style.left = progressPercent + "%";
    }

        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => { SoundEngine.playClick(); selectAnswer(idx); };
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
    }

    function triggerAnimation(isSuccess) {
        const container = document.getElementById("main-container");
        container.classList.remove("success-anim", "error-anim");
        void container.offsetWidth;
        if (isSuccess) {
            container.classList.add("success-anim");
        } else {
            container.classList.add("error-anim");
        }
    }

    function selectAnswer(selectedIndex) {
        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        triggerAnimation(isCorrect);

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            btn.disabled = true;
            if (shuffledOptionsCache[idx] === currentQuestionObj.correct) {
                btn.style.borderColor = "#5a9a45";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex && !isCorrect) {
                btn.style.borderColor = "#c1502f";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        const wikiBtn = document.getElementById("wiki-btn");
        const nextBtn = document.getElementById("next-btn");
        const comboBadge = document.getElementById("combo-badge");

        explanationBox.style.display = "block";

        if (isCorrect) {
            if (comboCount >= 2) { SoundEngine.playCombo(); } else { SoundEngine.playCorrect(); }
            consecutiveSuccess++;
            consecutiveErrors = 0;
            comboCount++;
            totalCorrect++;
            if (comboCount > bestCombo) bestCombo = comboCount;
            if (consecutiveSuccess > bestStreak) bestStreak = consecutiveSuccess;

            // +8 points pour la première bonne réponse, puis augmente avec le combo
            let earnedPoints = 8 + ((comboCount - 1) * 3);
            score += earnedPoints;

            pointsNotice.innerText = `✅ Bonne réponse ! (+${earnedPoints} Pts avec Combo x${comboCount})`;
            pointsNotice.style.color = "#8bc46e";

            checkAllTrophies();
        } else {
            SoundEngine.playWrong();
            consecutiveErrors++;
            consecutiveSuccess = 0;
            comboCount = 0;
            if (consecutiveErrors > bestErrorStreak) bestErrorStreak = consecutiveErrors;

            let penaltyPoints = 15;
            score = Math.max(0, score - penaltyPoints);

            pointsNotice.innerText = `❌ Mauvaise réponse ! (-${penaltyPoints} Pts)`;
            pointsNotice.style.color = "#d9694f";

            checkAllTrophies();
        }

        if (comboCount > 1) {
            comboBadge.style.display = "block";
            comboBadge.innerText = "🔥 x" + comboCount;
        } else {
            comboBadge.style.display = "none";
        }

        saveUserData();

        explanationText.innerText = currentQuestionObj.exp;

        if (currentQuestionObj.wiki) {
            wikiBtn.style.display = "flex";
            wikiBtn.href = currentQuestionObj.wiki;
        }

        nextBtn.style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function useJoker50() {
        if (jokers50Left <= 0) return;
        jokers50Left--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        let hiddenCount = 0;

        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && hiddenCount < 2) {
                btn.classList.add("hidden-by-joker");
                hiddenCount++;
            }
        });
        saveUserData();
    }

    function useJokerTip() {
        if (jokersTipLeft <= 0) return;
        jokersTipLeft--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && !btn.classList.contains("hidden-by-joker")) {
                btn.style.opacity = "0.3";
            }
        });
        saveUserData();
    }

    function trackWikiClick() {
        wikiClicks++;
        checkAllTrophies();
        saveUserData();
    }

    function shareScore() {
        const unlockedCount = trophies.filter(t => t.unlocked).length;
        const currentRank = ranks.slice().reverse().find(r => score >= r.min) || ranks[0];
        const text = `🌿 Quiz Jardinier - Expert Pro 🌿\n${currentAvatar} ${document.getElementById("profile-name-view").innerText}\n${currentRank.title}\n⭐ ${score} points\n🏆 ${unlockedCount}/${trophies.length} trophées débloqués\n\nViens tester tes connaissances de jardinier !`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier - Expert Pro', text: text, url: window.location.href }).catch(() => {});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                showAchievement("📋 Score copié ! Colle-le où tu veux");
            }).catch(() => {
                showAchievement("📋 " + text);
            });
        } else {
            showAchievement("📋 " + text);
        }
    }

    window.onload = function () {
        loadUserData();
        const btn = document.getElementById("sound-toggle-btn");
        if (btn) btn.innerText = SoundEngine.isMuted() ? "🔇" : "🔊";
    };

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        });
    }
</script>

</body>
</html>
